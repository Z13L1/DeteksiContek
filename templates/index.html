<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeteksiContek</title>
<style>
  body { margin: 0; background: #131313; color: #eee; font-family: system-ui, sans-serif; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 24px 16px; }
  h1 { margin: 0 0 4px; font-size: 22px; }
  .sub { color: #999; font-size: 13px; margin-bottom: 16px; }
  .stage { position: relative; width: 100%; aspect-ratio: 4 / 3; background: #000; border-radius: 12px; overflow: hidden; }
  video, canvas.overlay { position: absolute; inset: 0; width: 100%; height: 100%; }
  video { object-fit: fill; }
  .bar { display: flex; gap: 12px; align-items: center; margin-top: 14px; flex-wrap: wrap; }
  button { background: #2e7d32; color: #fff; border: 0; padding: 10px 18px; border-radius: 8px; font-size: 14px; cursor: pointer; }
  button.stop { background: #444; }
  .alert { margin-top: 14px; padding: 12px 16px; border-radius: 8px; background: #222; color: #aaa; font-weight: 600; }
  .alert.danger { background: #b71c1c; color: #fff; }
  .stats { font-family: monospace; font-size: 13px; color: #9e9e9e; }
</style>
</head>
<body>
<div class="wrap">
  <h1>DeteksiContek</h1>
  <div class="sub">Model: {{ model_name }}</div>

  <div class="stage">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay" class="overlay" width="640" height="480"></canvas>
  </div>

  <div class="bar">
    <button id="btnToggle">Mulai Deteksi</button>
    <label>Confidence: <b id="confVal">0.50</b>
      <input type="range" id="conf" min="0.1" max="0.9" step="0.05" value="0.5">
    </label>
    <span class="stats" id="stats">FPS: -</span>
  </div>

  <div class="alert" id="alertBox">Menunggu deteksi...</div>
</div>

<!-- Kanvas tersembunyi: tempat "memotret" frame video sebelum dikirim ke server -->
<canvas id="grab" width="640" height="480" style="display:none"></canvas>

<script>
const video = document.getElementById("video");
const overlay = document.getElementById("overlay");
const grab = document.getElementById("grab");
const octx = overlay.getContext("2d");
const gctx = grab.getContext("2d");
const btn = document.getElementById("btnToggle");
const confInput = document.getElementById("conf");
const confVal = document.getElementById("confVal");
const statsEl = document.getElementById("stats");
const alertBox = document.getElementById("alertBox");

let running = false;
let busy = false;       // true saat menunggu balasan server (supaya request tidak numpuk)
let lastTime = performance.now();

confInput.addEventListener("input", () => {
  confVal.textContent = Number(confInput.value).toFixed(2);
});

// 1. Nyalakan kamera
async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { width: 640, height: 480 }
    });
    video.srcObject = stream;
  } catch (err) {
    alertBox.textContent = "Kamera gagal dibuka: " + err.message;
  }
}

// 2. Satu putaran: potret frame -> kirim -> gambar hasil
async function detectLoop() {
  if (!running) return;

  if (!busy && video.readyState >= 2) {
    busy = true;
    gctx.drawImage(video, 0, 0, 640, 480);
    const image = grab.toDataURL("image/jpeg", 0.7);

    try {
      const res = await fetch("/api/detect", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ image: image, conf: Number(confInput.value) })
      });
      const data = await res.json();
      if (data.success) {
        drawDetections(data.detections);
        updateFps();
      }
    } catch (err) {
      alertBox.textContent = "Gagal menghubungi server: " + err.message;
    }
    busy = false;
  }
  requestAnimationFrame(detectLoop);
}

// 3. Gambar kotak di atas video
function drawDetections(dets) {
  octx.clearRect(0, 0, overlay.width, overlay.height);
  let cheatCount = 0;

  dets.forEach(d => {
    const [x1, y1, x2, y2] = d.box;
    const isCheat = d.label.toLowerCase().includes("cheat");
    if (isCheat) cheatCount++;

    const color = isCheat ? "#ff3b30" : "#30d158";
    octx.strokeStyle = color;
    octx.lineWidth = 3;
    octx.strokeRect(x1, y1, x2 - x1, y2 - y1);

    const text = d.label + " " + d.confidence.toFixed(2);
    octx.font = "16px monospace";
    const w = octx.measureText(text).width + 8;
    octx.fillStyle = color;
    octx.fillRect(x1, Math.max(0, y1 - 22), w, 22);
    octx.fillStyle = "#000";
    octx.fillText(text, x1 + 4, Math.max(16, y1 - 6));
  });

  if (cheatCount > 0) {
    alertBox.textContent = "PERINGATAN: " + cheatCount + " indikasi perilaku mencurigakan";
    alertBox.className = "alert danger";
  } else {
    alertBox.textContent = "Tidak ada indikasi (" + dets.length + " objek terdeteksi)";
    alertBox.className = "alert";
  }
}

function updateFps() {
  const now = performance.now();
  statsEl.textContent = "FPS: " + (1000 / (now - lastTime)).toFixed(1);
  lastTime = now;
}

btn.addEventListener("click", () => {
  running = !running;
  btn.textContent = running ? "Berhenti" : "Mulai Deteksi";
  btn.className = running ? "stop" : "";
  if (running) {
    detectLoop();
  } else {
    octx.clearRect(0, 0, overlay.width, overlay.height);
  }
});

startCamera();
</script>
</body>
</html>
